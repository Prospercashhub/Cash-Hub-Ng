<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet | Cash Hub NG</title><link rel="stylesheet" href="style.css"></head><body class="dashboard-page">
<header class="dash-header"><a class="logo" href="index.html">Cash<span>Hub</span> NG</a><div class="earn-header-actions"><a href="dashboard.html">Dashboard</a><button class="logout-btn" onclick="logout()">Logout</button></div></header>
<main class="wallet-page wallet-v5">
<p class="eyebrow">YOUR WALLET</p><h1>Wallet & Withdrawals</h1>
<section class="wallet-balance-card"><span>Available Balance</span><strong id="wallet-balance">$0.00</strong><small>Complete eligible activities to grow your balance.</small></section>
<section class="withdraw-grid">
<div class="panel"><h2>Request a withdrawal</h2><p class="muted">Submit a request when your balance meets the minimum requirement.</p>
<label>Amount</label><input id="withdraw-amount" type="number" min="10" step="0.01" placeholder="10.00">
<label>Withdrawal method</label><select id="withdraw-method"><option>Bank Transfer</option><option>Mobile Money</option><option>Other</option></select>
<button class="primary-btn" onclick="requestWithdrawal()">Request Withdrawal</button><div id="withdraw-message"></div></div>
<div class="panel"><h2>Withdrawal requests</h2><div id="withdrawals"></div></div>
</section>
<section class="panel transaction-panel"><div class="section-title"><h2>Transaction history</h2><a href="earn.html">Earn more →</a></div><div id="transactions"></div></section>
</main>
<nav class="bottom-nav"><a href="dashboard.html">⌂<span>Home</span></a><a href="earn.html">🎯<span>Earn</span></a><a class="active" href="wallet.html">💳<span>Wallet</span></a><a href="#">👤<span>Profile</span></a></nav>
<script src="auth.js"></script><script src="wallet.js"></script><script>renderWallet();renderWithdrawals();</script></body></html>
