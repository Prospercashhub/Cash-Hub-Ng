<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Hub NG - Earn</title>
<link rel="stylesheet" href="style.css">

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}
.container{
    max-width:800px;
    margin:auto;
}
.card{
    background:#fff;
    border-radius:10px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}
button{
    width:100%;
    padding:15px;
    background:#16a34a;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:18px;
}
iframe{
    width:100%;
    height:800px;
    border:none;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>Earn Money</h2>
<p>Complete surveys and offers to earn rewards.</p>

<button onclick="openOfferwall()">
Open CPX Offerwall
</button>

<div id="offerwall"></div>

</div>

</div>

<!-- Load the central API adapter before application scripts -->
<script src="api.js"></script>
<script src="auth.js"></script>

<script>
async function openOfferwall() {
  const session = JSON.parse(
    localStorage.getItem("cashHubNgSession") || "null"
  );

  if (!session) {
    alert("Please login first.");
    window.location.href = "login.html";
    return;
  }

  try {
    /*
     * CPX integration intentionally remains unchanged.
     * The CPX hash is still requested from the existing backend endpoint.
     */
    const response = await fetch(
      "https://cash-hub-ng2.onrender.com/api/cpx-hash?userId=" +
      encodeURIComponent(session.id)
    );

    const data = await response.json();

    if (!response.ok || !data.secureHash) {
      throw new Error(data.error || "Unable to create CPX secure hash.");
    }

    const offerUrl =
      "https://offers.cpx-research.com/index.php" +
      "?app_id=34986" +
      "&user_id=" + encodeURIComponent(session.id) +
      "&secure_hash=" + encodeURIComponent(data.secureHash) +
      "&email=" + encodeURIComponent(session.email || "") +
      "&username=" + encodeURIComponent(session.name || "");

    document.getElementById("offerwall").innerHTML =
      '<iframe src="' + offerUrl + '"></iframe>';

  } catch (error) {
    console.error("CPX offerwall error:", error);
    alert(error.message || "Unable to open the offerwall. Please try again.");
  }
}
</script>

</body>
    </html>
