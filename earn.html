<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Hub NG - Earn</title>
<link rel="stylesheet" href="style.css">
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px}
.container{max-width:800px;margin:auto}
.card{background:#fff;border-radius:10px;padding:15px;margin-bottom:20px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
button{width:100%;padding:15px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-size:18px;margin-top:10px}
iframe{width:100%;height:800px;border:none;margin-top:20px}
</style>
</head>
<body class=\"app-dark\">
<div class="container">
  <div class="card">
    <h2>Earn Money</h2>
    <p>Complete surveys and offers to earn rewards.</p>
    <button onclick="openOfferwall()">Open CPX Offerwall</button>
    <button onclick="openEarnWall()">Open EarnWall</button>
    <button onclick="openAdsWedMedia()">Open AdsWedMedia</button>
    <div id="offerwall"></div>
  </div>
</div>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>
async function openOfferwall() {
  const session = typeof getSession === "function" ? getSession() : null;
  if (!session || typeof session.id !== "string" || !session.id.trim()) {
    alert("Please log in again before opening the CPX wall.");
    window.location.href = "login.html";
    return;
  }
  const userId = session.id.trim();
  try {
    const data = await window.api("/api/cpx-hash?userId=" + encodeURIComponent(userId));
    if (!data || !data.secureHash) throw new Error(data.error || "Unable to create CPX secure hash.");
    const offerUrl = "https://offers.cpx-research.com/index.php" +
      "?app_id=34986" +
      "&ext_user_id=" + encodeURIComponent(userId) +
      "&secure_hash=" + encodeURIComponent(data.secureHash) +
      "&email=" + encodeURIComponent(session.email || "") +
      "&username=" + encodeURIComponent(session.name || "");
    document.getElementById("offerwall").innerHTML = '<iframe src="' + offerUrl + '"></iframe>';
  } catch (error) {
    console.error("CPX offerwall error:", error);
    alert(error.message || "Unable to open the CPX wall. Please try again.");
  }
}

async function openEarnWall() {
  const session = typeof getSession === "function" ? getSession() : null;
  if (!session || typeof session.id !== "string" || !session.id.trim()) {
    alert("Please log in again before opening EarnWall.");
    window.location.href = "login.html";
    return;
  }
  try {
    const data = await window.api("/api/earnwall-config?userId=" + encodeURIComponent(session.id.trim()));
    if (!data || !data.offerwallUrl) throw new Error(data.error || "Unable to open EarnWall.");
    document.getElementById("offerwall").innerHTML = '<iframe src="' + data.offerwallUrl + '"></iframe>';
  } catch (error) {
    console.error("EarnWall error:", error);
    alert(error.message || "Unable to open EarnWall. Please try again.");
  }
}
async function openAdsWedMedia() {
  const session = typeof getSession === "function" ? getSession() : null;
  if (!session || typeof session.id !== "string" || !session.id.trim()) {
    alert("Please log in again before opening AdsWedMedia.");
    window.location.href = "login.html";
    return;
  }

  const userId = session.id.trim();

  try {
    // AdsWedMedia public/site key. Keep the secret key server-side only.
    const publicKey = "Nh1Cl1";

    const offerUrl =
      "https://adswedmedia.com/offer/" +
      encodeURIComponent(publicKey) +
      "/" +
      encodeURIComponent(userId);

    document.getElementById("offerwall").innerHTML =
      '<iframe src="' + offerUrl + '" width="100%" height="700" frameborder="0" scrolling="yes" loading="eager" allow="clipboard-write; fullscreen; autoplay" style="display:block;width:100%;height:700px;border:0;pointer-events:auto;touch-action:auto"></iframe>';
  } catch (error) {
    console.error("AdsWedMedia error:", error);
    alert(error.message || "Unable to open AdsWedMedia. Please try again.");
  }
}

window.openAdsWedMedia = openAdsWedMedia;
window.openEarnWall = openEarnWall;
</script>
</body>
</html>
